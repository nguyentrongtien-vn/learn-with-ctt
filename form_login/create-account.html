<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tạo tài khoản</title>
    <link rel="stylesheet" href="DesignAccount.css" />
  </head>
  <body>
    <form class="form-data">
      <h2 class="heading">Điền thông tin của bạn</h2>
      <div>
        <label for="UserName"> Tên đăng nhập</label>
        <input type="text" id="user" placeholder="NguyenVanA" />
      </div>
      <div>
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="n82219@gmail.com" />
      </div>
      <div>
        <label for="password">Mật khẩu</label>
        <input type="password" id="password" placeholder="Nght2794@" />
      </div>
      <div>
        <label for="phoneNumber">Số điện thoại</label>
        <input type="number" id="phoneNumber" placeholder="000xxx000" />
      </div>
      <div class="policy">
        <input type="checkbox" id="policy" name="policy" />
        <label for="policy"> Chấp nhận điều khoản bảo mật thông tin.</label>
      </div>
      <button class="button">Xác nhận tạo tài khoản</button>
    </form>
  </body>
</html>
