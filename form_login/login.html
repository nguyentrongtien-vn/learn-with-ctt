<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="login-container">
      <h1 class="heading-title">Chào mừng bạn trở lại</h1>
      <p class="title">Đăng nhập vào tài khoản!</p>
      <form class="content-infor">
        <div class="input-group">
          <label for="User">Tên đăng nhập</label>
          <input type="text" id="User" placeholder="NguyenVanA" />
        </div>
        <div class="input-group">
          <label for="password">Mật khẩu</label>
          <input
            type="password"
            id="password"
            placeholder="Nght2794@"
          />
        </div>
        <p class="wrong-input">Tên đăng nhập hoặc mật khẩu sai. Vui lòng thử lại.</p>
        <button type="submit"><b>Đăng nhập</b></button>
        <p>Bạn đã có tài khoản chưa? <a href="./create-account.html" class="create-account">Tạo tài khoản</p>
      </form>
    </div>
  </body>
</html>
